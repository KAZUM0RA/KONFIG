<h1>Справочник "Кассы"</h1>
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Кассы предприятия предназначены для автоматизации учета остатков и движения наличных денежных средств в случае, когда у <a href="Catalog.Организации/Help">организации</a> существует несколько мест хранения наличных денег.<o:p></o:p></span></p></body></html>
