<p class="Usual">Діалог "Вибір користувача операційної системи" дозволяє вибрати одного з користувачів зареєстрованих в операційній системі.</p>
<p class="Usual">У списку "<strong class="ControlElement">Домени</strong>" відображаються імена доменів, видимих з цього комп'ютера.</p>
<p class="Usual">У списку "<strong class="ControlElement">Користувачі</strong>" відображаються імена користувачів, зареєстрованих у вибраному домені.</p>
