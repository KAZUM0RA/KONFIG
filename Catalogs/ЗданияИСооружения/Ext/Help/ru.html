<h1>Справочник "Здания и сооружения"</h1>
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Под зданиями в прикладном решении понимаются обслуживаемые управляющей организацией объекты трех типов: здания, общежития и паркинг</span><span style="FONT-FAMILY: 'Verdana','sans-serif'">и. </span></p><span style="FONT-FAMILY: 'Verdana','sans-serif'">
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Справочник предназначен для ведения списка зданий, обслуживаемых управляющими <a href="Catalog.Организации/Help">организациями</a> предприятия. <o:p></o:p></span></p><o:p></o:p></span></body></html>
