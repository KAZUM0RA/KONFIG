<h1>Справочник "Темы голосования"</h1>
<p>Список вопросов выносимых на голосование членов ОСМД хранится в линейном справочнике <strong>Темы голосования</strong>.</p>
<p>Вопросы, выносимые на голосование могут предлагаться как членами ОСМД так и работниками управляющей организации.</p></body></html>
