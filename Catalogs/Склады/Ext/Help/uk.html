<h1>Довідник "Склади"</h1>
<p class="Paragraph0" style="MARGIN: 0cm 0cm 6pt; TEXT: left" align="left"><span>Облік запасів ведеться в розрізі складів. Під складом в системі розуміється будь-яке місце зберігання запасів : приміщення, шафа, відповідальна особа, фахівець і тому подібне </span></p><span>
<p class="Paragraph0" style="MARGIN: 0cm 0cm 6pt; TEXT: left" align="left"><span>У полі <b style="mso: normal">Найменування</b> вказується назва складу або прізвище фахівця, матеріально відповідальної особи.<o: p=""></o:></span></p><o: p=""></o:></span></body></html>
