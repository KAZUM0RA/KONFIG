<h1>Справочник "Склады"</h1>
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Учет запасов ведется в разрезе складов. Под складом в системе понимается любое место хранения запасов: помещение, шкаф, ответственное лицо, специалист и т.п. </span></p><span style="FONT-FAMILY: 'Verdana','sans-serif'">
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">В поле <b style="mso-bidi-font-weight: normal">Наименование</b> указывается название склада или фамилия специалиста, материально ответственного лица.<o:p></o:p></span></p><o:p></o:p></span></body></html>
