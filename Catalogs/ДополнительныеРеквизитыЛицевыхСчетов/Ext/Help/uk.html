<h1>Довідник "Додаткові реквізити особових рахунків"</h1>
<p>Цей довідник призначений для створення і зберігання послуг довільного характеру. </p>
<p>Значення для нарахувань цих послуг задається документом "Зміна особового рахунку" з видом операції "Заміна додаткових реквізитів"</p></body></html>
