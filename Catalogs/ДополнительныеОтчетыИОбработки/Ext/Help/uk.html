<h1>Довідник "Додаткові звіти і обробки"</h1>
<p>Для зберігання в ИБ додаткових звітів і обробок служить довідник <strong>Додаткові звіти і обробки</strong>. По команді <strong>Створити</strong> система запропонує вибрати файл <a href="v 8help ://1cv8/ExtRepotrs">зовнішньої обробки або звіту</a>, і <a href="./id685373b7 - 638a-439a-8cba-703d56e4e404/038b5c85 - fb1c - 4082-9c4c - e69f8928bf3a">настроїти його параметри</a>.</p></body></html>
