<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta content="text/html; charset=utf - 8" http-equiv="Content-Type"></meta><link rel="stylesheet" type="text/css" href="v 8help ://service _ book/service _ style"></link><meta name="GENERATOR" content="MSHTML 10.00.9200.16635"></meta></head><body>У формі необхідно вказати <strong>Номер телефону</strong> чи факсу. У окремих полях вказуються <strong>Код країни</strong> і <strong>Код міста</strong>. Можна додатково вказати <strong>Додатковий номер</strong> абонента, а так само вказати доп. інформацію в полі <strong>Коментар</strong>. </body></html>
