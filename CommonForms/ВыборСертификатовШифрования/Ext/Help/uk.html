<h1>Шифрування</h1>
<p>У формі вибираються сертифікати електронного цифрового підпису(ЭЦП) для шифрування файлу.</p>
<p>Для шифрування можна вибрати декілька сертифікатів, встановивши позначки для потрібних сертифікатів.</p>
