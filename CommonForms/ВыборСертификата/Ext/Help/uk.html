<h1>Вибір персонального сертифікату для шифрування</h1>
<p>У формі вибирається персональний сертифікат електронного цифрового підпису(ЭЦП) для шифрування даних.</p>
<p>При виборі сертифікатів для шифрування цей сертифікат буде завжди відмічений.</p>
