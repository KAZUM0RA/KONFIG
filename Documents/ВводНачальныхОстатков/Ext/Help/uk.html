<h1>Документ "Введення початкових залишків"</h1>
<p>Документ призначений для початкового введення залишків по розділах обліку.</p>
<p>Застосовується при введенні програми в експлуатацію на працюючому підприємстві(організації).</p>
<p>При необхідності внести (перенести) аванс, послуга і місяць нарахування не вказуються.</p></body></html>
