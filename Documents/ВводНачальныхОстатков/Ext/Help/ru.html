<h1>Документ "Ввод начальных остатков"</h1>
<p>Документ предназначен для начального ввода остатков по разделам учета.</p>
<p>Применяется при вводе программы в эксплуатацию на работающем предприятии (организации).</p>
<p>При необходимости внести (перенести) аванс, услуга и месяц начисления не указываются.</p></body></html>
