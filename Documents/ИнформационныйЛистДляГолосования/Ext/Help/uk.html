<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta content="text/html; charset=utf-8" http-equiv="Content-Type"></meta><link rel="stylesheet" type="text/css" href="v8help://service_book/service_style"></link><meta name="GENERATOR" content="MSHTML 10.00.9200.16635"></meta></head><body><span style="FONT-FAMILY: 'Verdana','sans-serif'">
<h1 style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Документ "Інформаційний лист для голосування" </span></h1></span>
<p class="Paragraph0" style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Документ <b style="mso-bidi-font-weight: normal">Створення інформаційного листа </b>призначений для формування друкованих інформаційних форм необхідних для підготовки і проведення голосування. <o:p></o:p></span></p>
<p class="Paragraph0" style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Окремий документ створюється для кожної будівлі і для кожного питання, що виноситься на голосування.<o:p></o:p></span></p></body></html>
