<h1 style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Документ "Информационный лист для голосования" </span></h1></span>
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Документ <b style="mso-bidi-font-weight: normal">Создание информационного листа</b> предназначен для формирования печатных информационных форм необходимых для подготовки и проведения голосования. <o:p></o:p></span></p>
<p style="TEXT-ALIGN: left; MARGIN: 0cm 0cm 6pt" class="Paragraph0" align="left"><span style="FONT-FAMILY: 'Verdana','sans-serif'">Отдельный документ создается для каждого здания и для каждого вопроса, выносимого на голосование.<o:p></o:p></span></p></body></html>
