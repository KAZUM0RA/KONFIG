<h1>Обробка "Документи по особовому рахунку"</h1>
<p style="MARGIN: 0px">У списку показуються усі документи, які були оформлені з конкретним <a href="./id143ce8cf - 0ffa-4047 - b785 - 028be17254b6/038b5c85 - fb1c - 4082-9c4c - e69f8928bf3a">особовим рахунком</a>. Список показуваних документів можна обмежити: показувати тільки документи певного виду і за певний період часу.</p></body></html>
