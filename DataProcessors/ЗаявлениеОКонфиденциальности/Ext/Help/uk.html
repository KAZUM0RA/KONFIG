<p><strong><font size="4">Обробка "Заява про конфіденційність"</font></strong></p>
<p><font size="2">Ця обробка пропонує користувачеві, заповнивши дані про продукт і організацію, зареєструватися в службі підтримки для ефективного вирішення питань, що виникали під час експлуатації програми "Облік в ОСББ, розрахунок квартплати в Україні".</font></p></body></html>
