<h1><font size="4" face="Verdana">Отчет "Ведомость по пересчету"</font> </h1>
<p><font size="2">Для формирования отчета нажмите кнопку " <strong>Сформировать </strong>". По умолчанию в отчет попадет весь пересчет начислений на лицевые счета.</font></p>
<p><font size="2">Отчет <font color="#333333">содержит сведения обо всех перерасчетах и корректировках</font></font>.</p></body></html>
