<h1>Звіт "Дата заборони завантаження"</h1>
<p>Для формування звіту натисніть кнопку "<strong>Сформувати</strong>". За умовчанням в звіт потраплять усі завдання за поточний місяць зі збіглим терміном виконання.</p>
<p>Для детального налаштування звіту використайте команду "<strong>Усі дії - Змінити варіант</strong>".</p></body></html>
