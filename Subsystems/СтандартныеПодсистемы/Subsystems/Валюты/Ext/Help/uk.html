<p class="MsoNormal">Програма підтримує багатовалютний облік, і дозволяє вводити операції і переглядати звіти у будь-якій валюті, представленій в довіднику <b style="mso: normal">Валюти</b>. Конфігурація поставляється з "Загальноросійським класифікатором валют"(ОКВ). Існує можливість завантаження курсів валют з сайту "РосБизнесКонсалтинг".</p></body></html>
